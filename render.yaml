services:
  - type: web
    name: quant-alpha-live
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: MARKET_INTERVAL
        value: 15min
      - key: TD_XAUUSD_SYMBOL
        value: XAU/USD
      - key: TD_JPN225_SYMBOL
        value: N225
